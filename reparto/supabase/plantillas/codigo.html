<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#edf1f5;font-family:Arial,Helvetica,sans-serif;color:#10212f">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px">
      <tr><td style="background:#143b5c;color:#ffffff;padding:20px 24px;border-radius:12px 12px 0 0;font-size:20px;font-weight:bold">Tu código para entrar</td></tr>
      <tr><td style="padding:24px">
        <p style="margin:0 0 16px">Escribe este código en la app o en el panel:</p>
        <p style="margin:0 0 16px;font-family:'Courier New',monospace;font-size:34px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
        <p style="margin:0 0 8px">Dura 10 minutos y sirve una sola vez.</p>
        <p style="margin:0;color:#566676;font-size:14px">Si no lo pediste, ignora este correo: nadie puede entrar sin el código.</p>
      </td></tr>
    </table>
  </body>
</html>
