# Reparto · revisión automática (SPEC 11): corre en cada cambio dentro de reparto/.
# Ninguna fase se cierra con esto en rojo.
name: Reparto · revisión

on:
  push:
    paths: ["reparto/**", ".github/workflows/reparto.yml"]
  pull_request:
    paths: ["reparto/**", ".github/workflows/reparto.yml"]
  workflow_dispatch:

concurrency:
  group: reparto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: reparto

jobs:
  codigo:
    name: Tipos, estilo, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: reparto/.nvmrc
          cache: npm
          cache-dependency-path: reparto/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Ninguna librería no oficial de WhatsApp (docs/agentes-y-whatsapp.md, 9.1)
        run: |
          if grep -qiE '"node_modules/(@whiskeysockets/)?baileys"|"node_modules/whatsapp-web\.js"|"node_modules/venom-bot"|"node_modules/@wppconnect' package-lock.json; then
            echo "::error::Hay una librería no oficial de WhatsApp. Solo se permite la API oficial de Meta."; exit 1
          fi
      - run: npm run tipos
      - run: npm run lint
      - run: npm test
      - name: Compilar el panel web
        run: npm run build --workspace web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Empaquetar la app (Android e iPhone)
        run: npm run exportar --workspace movil
        env:
          EXPO_OFFLINE: "1"
          CI: "1"

  punta-a-punta:
    name: Base de datos y pruebas de punta a punta (panel y app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: reparto/.nvmrc
          cache: npm
          cache-dependency-path: reparto/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci --no-audit --no-fund
      - name: Levantar Supabase local (solo lo necesario)
        run: supabase start -x imgproxy,studio,logflare,vector,supavisor,postgres-meta
      - name: Pruebas de base de datos (pgTAP)
        run: supabase test db
      - name: Variables de Supabase local
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed 's/"//g' > /tmp/supa.env
          echo "E2E_SUPABASE_URL=$(grep API_URL /tmp/supa.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$(grep ANON_KEY /tmp/supa.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
        working-directory: reparto/apps/web
      - name: Panel de punta a punta
        working-directory: reparto/apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          NEXT_PUBLIC_SUPABASE_URL=$E2E_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY=$E2E_SUPABASE_ANON_KEY NEXT_PUBLIC_MAPA_ESTILO=vacio npm run build
          npm run e2e
      - name: Panel de punta a punta en Cloudflare (workerd, como en producción)
        working-directory: reparto/apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_SERVIDOR: cloudflare
        run: |
          printf 'GEOCODER=simulado\n' > .dev.vars
          NEXT_PUBLIC_SUPABASE_URL=$E2E_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY=$E2E_SUPABASE_ANON_KEY NEXT_PUBLIC_MAPA_ESTILO=vacio npm run cf:build
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cf" | tee "$RUNNER_TEMP/cf.txt"
          # Tope del plan gratis de Workers: 3 MB comprimido. Avisa desde 2,9 MB.
          kib=$(grep -oE 'gzip: [0-9.]+' "$RUNNER_TEMP/cf.txt" | grep -oE '[0-9.]+' | cut -d. -f1)
          if [ "$kib" -gt 3072 ]; then echo "::error::El panel pesa ${kib} KiB comprimido: pasa los 3 MB del plan gratis de Workers"; exit 1; fi
          if [ "$kib" -gt 2900 ]; then echo "::warning::El panel pesa ${kib} KiB comprimido, cerca de los 3 MB del plan gratis"; fi
          npm run e2e
      - name: App de punta a punta (versión web de Expo)
        working-directory: reparto/apps/movil
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
        run: |
          EXPO_PUBLIC_SUPABASE_URL=$E2E_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY=$E2E_SUPABASE_ANON_KEY npm run exportar:web
          npm run e2e

  claves:
    name: Ninguna clave subida por error (SPEC 9)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Buscar claves con gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source=/repo --no-banner --redact --log-opts="-- reparto"
