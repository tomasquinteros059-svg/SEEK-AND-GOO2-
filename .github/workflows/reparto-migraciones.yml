# Reparto · aplica las migraciones de supabase/migrations al proyecto de
# DESARROLLO en Supabase y publica las funciones (como el Agente de Entregas).
# Se lanza a mano desde GitHub → Actions.
# (Producción tendrá su propio botón, con aprobación, cuando exista.)
name: Reparto · migraciones (desarrollo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reparto
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROYECTO: ${{ vars.SUPABASE_PROYECTO_DESARROLLO }}
    steps:
      - name: Revisar que esté lo necesario
        working-directory: .
        run: |
          falta=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && falta="$falta secreto SUPABASE_ACCESS_TOKEN;"
          [ -z "$SUPABASE_DB_PASSWORD" ] && falta="$falta secreto SUPABASE_DB_PASSWORD;"
          [ -z "$PROYECTO" ] && falta="$falta variable SUPABASE_PROYECTO_DESARROLLO;"
          if [ -n "$falta" ]; then echo "::error::Falta:$falta ver reparto/docs/fase-0.md"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROYECTO" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - run: supabase functions deploy --project-ref "$PROYECTO"
